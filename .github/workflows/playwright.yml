name: Playwright tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # liverpool.com.mx está detrás de un WAF (Akamai Bot Manager) que
      # bloquea el navegador de Playwright de forma consistente (ver
      # TEST_STRATEGY.md -> "BLOQUEADOR"), y los runners de GitHub Actions no
      # están whitelisteados. TEST_MODE=mock corre la suite contra un fixture
      # local autocontenido (nunca toca la red real) — es el único modo
      # viable en CI hoy. No cambiar a `live` aquí a menos que se resuelva el
      # whitelist del lado de Liverpool.
      TEST_MODE: mock
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npx playwright install --with-deps chromium

      - run: npm run typecheck

      - run: npx playwright test

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
